name: Build e Deploy Grolpy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar Grolpy
        run: npm run build


      - name: Preparar arquivos de producao
        run: |
          rm -rf deploy
          mkdir -p deploy

          # O projeto usa ESM; o bootstrap importa o backend compilado em CommonJS.
          printf "import './dist/server.cjs';\n" > deploy/server.js
          cp package.json deploy/package.json
          if [ -f package-lock.json ]; then cp package-lock.json deploy/package-lock.json; fi

          # Configuracao suportada pelo CloudLinux Node.js Selector + LiteSpeed.
          # Nao inclui segredos e nao toca no .env persistente do servidor.
          printf '%s\n' \
            'PassengerAppRoot /home3/minhabagg/grolpy.minhabagg.com.br' \
            'PassengerBaseURI /' \
            'PassengerAppType node' \
            'PassengerStartupFile server.js' \
            'PassengerAppEnv production' \
            'PassengerNodejs /home3/minhabagg/nodevenv/grolpy.minhabagg.com.br/22/bin/node' \
            'SetEnv LSNODE_CONSOLE_LOG stderr.log' \
            'Options -MultiViews' > deploy/.htaccess

          # Backend compilado + copia do frontend para o fallback SPA do Express
          cp -r dist deploy/dist
          mkdir -p deploy/uploads
          cp uploads/tabela-planos-groply.png deploy/uploads/tabela-planos-groply.png

          # O Passenger usa o ambiente Node Selector do cPanel. Instala somente
          # o driver MySQL dentro do pacote de deploy, sem alterar o .env.
          mkdir -p deploy/node_modules
          cp -r node_modules/mysql2 deploy/node_modules/mysql2
          for pkg in denque generate-function is-property lru.min named-placeholders seq-queue sqlstring; do
            if [ -d "node_modules/$pkg" ]; then cp -r "node_modules/$pkg" deploy/node_modules/; fi
          done

          # O Apache/cPanel pode servir arquivos fisicos na raiz antes do Passenger.
          # Publicamos tambem o frontend Vite compilado na raiz para evitar que
          # um index.html-fonte antigo carregue /src/main.tsx em producao.
          cp dist/index.html deploy/index.html
          if [ -d dist/assets ]; then cp -r dist/assets deploy/assets; fi

          # Reinicia o Passenger apos cada deploy para carregar o backend novo.
          mkdir -p deploy/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

      - name: Enviar para hospedagem
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
