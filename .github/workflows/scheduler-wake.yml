name: Manter agendador Groply ativo
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acordar backend para executar horarios pendentes
        run: curl --fail --silent --show-error --max-time 45 --retry 2 https://grolpy.minhabagg.com.br/api/health
