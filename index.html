    <script>
      (function() {
        var _decodeURI = window.decodeURI;
        var _decodeURIComponent = window.decodeURIComponent;
        var _encodeURIComponent = window.encodeURIComponent;

        window.decodeURI = function(uri) {
          try {
            return _decodeURI(uri);
          } catch (e) {
            if (e instanceof URIError) {
              try {
                return _decodeURI(String(uri).replace(/%(?![0-9a-fA-F]{2})/g, '%25'));
              } catch (_) {
                return String(uri);
              }
            }
            throw e;
          }
        };

        window.decodeURIComponent = function(val) {
          try {
            return _decodeURIComponent(val);
          } catch (e) {
            if (e instanceof URIError) {
              try {
                return _decodeURIComponent(String(val).replace(/%(?![0-9a-fA-F]{2})/g, '%25'));
              } catch (_) {
                return String(val);
              }
            }
            throw e;
          }
        };

        window.encodeURIComponent = function(val) {
          try {
            var str = String(val == null ? '' : val);
            if (typeof str.toWellFormed === 'function') {
              str = str.toWellFormed();
            } else {
              str = str.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '');
            }
            return _encodeURIComponent(str);
          } catch (e) {
            if (e instanceof URIError) {
              try {
                var cleaned = String(val == null ? '' : val).replace(/[\uD800-\uDFFF]/g, '');
                return _encodeURIComponent(cleaned);
              } catch (_) {
                return escape(String(val == null ? '' : val));
              }
            }
            throw e;
          }
        };
      })();
    </script>
